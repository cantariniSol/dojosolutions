apiVersion: apps/v1
kind: Deployment
metadata:
  name: dojosolutions
  namespace: dojosolutions
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dojosolutions
  template:
    metadata:
      labels:
        app: dojosolutions
        cost-center: engineering
    spec:
      containers:
        - name: app
          image: ghcr.io/cantarinisol/dojosolutions:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: dojosolutions-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
