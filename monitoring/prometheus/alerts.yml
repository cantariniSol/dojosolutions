groups:
  - name: dojosolutions-alerts
    rules:
      - alert: DojoSolutionsApiDown
        expr: up{job="dojosolutions"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: DojoSolutions API is unreachable
          description: Prometheus cannot scrape the application metrics endpoint.

      - alert: DojoSolutionsLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(dojosolutions_http_request_duration_ms_bucket[5m])) by (le)) > 500
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: P95 latency is above 500ms
          description: Review scaling, application logs and database connectivity.
