services:
  mongo:
    image: mongo:8
    container_name: dojosolutions-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: dojosolutions
    volumes:
      - mongo_data:/data/db
    networks:
      - dojonet
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./application/backend
      target: production
    container_name: dojosolutions-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/dojosolutions
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - dojonet
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./application/frontend
      target: production
      args:
        VITE_API_URL: http://localhost:3000/api
    container_name: dojosolutions-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - dojonet

volumes:
  mongo_data:

networks:
  dojonet:
    name: dojosolutions-net
