name: CD - Publicar imágenes

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build y push a GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalizar usuario de GitHub
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Construir y publicar backend
        uses: docker/build-push-action@v6
        with:
          context: ./application/backend
          target: production
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/dojosolutions-backend:latest
            ghcr.io/${{ steps.owner.outputs.value }}/dojosolutions-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Construir y publicar frontend
        uses: docker/build-push-action@v6
        with:
          context: ./application/frontend
          target: production
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:3000/api' }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/dojosolutions-frontend:latest
            ghcr.io/${{ steps.owner.outputs.value }}/dojosolutions-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend