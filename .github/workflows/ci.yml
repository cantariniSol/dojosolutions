name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend - typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/backend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  frontend:
    name: Frontend - lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker-build:
    name: Validar Dockerfiles (build sin push)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build imagen backend
        uses: docker/build-push-action@v6
        with:
          context: ./application/backend
          target: production
          push: false

      - name: Build imagen frontend
        uses: docker/build-push-action@v6
        with:
          context: ./application/frontend
          target: production
          push: false

  dependency-audit:
    name: Auditoría de dependencias (SAST básico)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm audit --omit=dev --audit-level=high
        working-directory: application/backend
        continue-on-error: true
      - run: npm audit --omit=dev --audit-level=high
        working-directory: application/frontend
        continue-on-error: true

  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3